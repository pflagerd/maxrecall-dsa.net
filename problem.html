<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problem — MaxRecall DSA</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
</head>
<body class="problem-body">
  <header class="site-header problem-header">
    <a class="back-link" href="/">&larr; All problems</a>
    <h1 id="problem-title">Loading...</h1>
    <span id="problem-difficulty" class="badge"></span>
    <div class="header-actions">
      <button id="reset-split-btn" class="icon-btn" type="button" title="Reset panel split to 50/50" aria-label="Reset panel split to 50/50">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <line x1="12" y1="5" x2="12" y2="19"/>
        </svg>
      </button>
      <button id="fullscreen-btn" class="icon-btn" type="button" title="Enter full screen" aria-label="Enter full screen">
        <svg id="fullscreen-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9V4h5"/>
          <path d="M20 9V4h-5"/>
          <path d="M4 15v5h5"/>
          <path d="M20 15v5h-5"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="problem-main">
    <section class="pane description-pane">
      <div id="problem-tags" class="problem-tags"></div>
      <div id="problem-description" class="problem-description"></div>

      <h3>Examples</h3>
      <div id="problem-examples"></div>

      <h3>Constraints</h3>
      <ul id="problem-constraints"></ul>
    </section>

    <div id="pane-resizer" class="pane-resizer" role="separator" aria-orientation="vertical" aria-label="Resize panels"></div>

    <section class="pane editor-pane">
      <div class="editor-toolbar">
        <select id="language-select">
          <option value="javascript">JavaScript</option>
          <option value="python">Python</option>
          <option value="cpp">C++</option>
        </select>
        <button id="run-btn">Run</button>
        <button id="submit-btn" class="primary">Submit</button>
        <button id="skip-btn">Skip</button>
      </div>

      <div id="editor-host"></div>

      <div class="console-panel">
        <div class="console-header">
          <span id="console-status">Run your code to see results.</span>
        </div>
        <div id="console-results"></div>
      </div>
    </section>
  </main>

  <div id="language-switch-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>Discard your changes?</h3>
      <p>You've modified the starter code for this language. Switching languages will discard those changes.</p>
      <div class="modal-actions">
        <button id="modal-cancel-btn">Cancel</button>
        <button id="modal-discard-btn" class="primary">Discard &amp; Switch</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="problem-page.js"></script>
</body>
</html>

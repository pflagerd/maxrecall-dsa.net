<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaxRecall Code — Problems</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>MaxRecall Code</h1>
    <p class="tagline">Learn, practice and recall code, data structures and algorithms</p>
    <p id="account" class="account"></p>
  </header>

  <main>
    <section class="list-wrap">
      <!-- The question bank's link, or the way back from it (#133): shown by
           problems-list.js only to whoever may see the bank. -->
      <p id="view-switch" class="view-switch"></p>
      <div id="next-line" class="next-line"></div>
      <!-- Scrolls sideways on its own when the table is wider than the
           screen (a phone; the bank's language columns), so the page doesn't. -->
      <div class="table-scroll">
      <table class="problem-list">
        <!-- The queue's columns; the question bank (?view=bank) replaces them. -->
        <thead id="problem-head">
          <tr>
            <th title="Your queue's order: 1 is next">#</th>
            <th>Title</th>
            <th>Language</th>
            <th>Last result</th>
            <th>Sources &amp; topics</th>
            <th>Difficulty</th>
          </tr>
        </thead>
        <tbody id="problem-rows">
          <tr><td colspan="6">Loading problems...</td></tr>
        </tbody>
      </table>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> MaxRecall Code</p>
  </footer>

  <script src="account.js"></script>
  <script src="bubbles.js"></script>
  <script src="problems-list.js"></script>
</body>
</html>

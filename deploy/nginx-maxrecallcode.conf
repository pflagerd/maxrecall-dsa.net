# nginx in front of MaxRecall DSA on the VPS: HTTPS for the three domains,
# with maxrecallcode.net the site's address (owner, 2026-11-05) and the
# other two redirecting to it. Install it by following docs/deploy-vps.md
# §13 (limited-live plan, step 3). nginx 1.24 (Ubuntu 24.04).
#
# It reads, from outside this file:
#   /etc/letsencrypt/live/maxrecallcode.net/   the certificate (certbot)
#   /var/www/letsencrypt/                      certbot's renewal challenges
#   /etc/nginx/maxrecall.htpasswd              the testers' shared Basic
#                                              auth login (D3)
#
# Only ever proxies to 127.0.0.1:3000, the port that needs signing in.
# Never to 3001, the trusted port, where everyone is the owner.

# Sign-in attempts per visitor address (D3): login and register each check
# a password with a 128 MiB scrypt hash (auth.js), so they're limited
# here, before they reach the app. 10 a minute, plus a burst of 5.
# Only those two: every page asks /api/auth/me (account.js), so a limit
# on all of /api/auth/ would break ordinary browsing. This file is
# included inside nginx.conf's http { } block, where this belongs.
limit_req_zone $binary_remote_addr zone=maxrecall_signin:10m rate=10r/m;

# Plain HTTP, all three names: the certificate challenges certbot uses to
# renew, and otherwise a permanent redirect to the HTTPS site.
server {
    listen 80;
    listen [::]:80;
    server_name maxrecallcode.net maxrecallcode.com maxrecallcode.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://maxrecallcode.net$request_uri;
    }
}

# HTTPS for the other two names: straight to maxrecallcode.net. The one
# certificate covers all three, so this works without a warning.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maxrecallcode.com maxrecallcode.org;

    ssl_certificate     /etc/letsencrypt/live/maxrecallcode.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maxrecallcode.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://maxrecallcode.net$request_uri;
}

# The site.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maxrecallcode.net;

    ssl_certificate     /etc/letsencrypt/live/maxrecallcode.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maxrecallcode.net/privkey.pem;
    # Ubuntu's nginx.conf still allows TLSv1 and TLSv1.1.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Browsers use only HTTPS for this name for a day after a visit (HSTS,
    # RFC 6797). A day while testing; a year (31536000) once it's settled.
    # No includeSubDomains or preload: both are hard to undo.
    add_header Strict-Transport-Security "max-age=86400" always;

    # D3: one shared login for testers, in front of everything, while
    # testing is limited. Their own invite and password come after it.
    auth_basic "MaxRecall testing";
    auth_basic_user_file /etc/nginx/maxrecall.htpasswd;

    # What the app is told about each request. X-Forwarded-Proto makes
    # Express's req.secure true, and so the session cookie Secure
    # (trust proxy 'loopback', server.js). X-Forwarded-For is the
    # visitor's address, replacing whatever they sent. The Basic auth
    # password isn't passed on: the app has no use for it.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization "";
    # A Submit can wait behind 10 others in the judge's queue, 2 at a time
    # on the VPS, each up to about 30 s (judge/runner.js, judge/queue.js):
    # about 3 minutes at worst, beyond nginx's 60 s default.
    proxy_read_timeout 300s;

    location = /api/auth/login {
        limit_req zone=maxrecall_signin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/auth/register {
        limit_req zone=maxrecall_signin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

# nginx in front of MaxRecall DSA on the VPS: HTTPS for the three domains,
# with maxrecallcode.net the site's address (owner, 2026-11-05) and the
# other two redirecting to it. Install it by following docs/deploy-vps.md
# §13 (limited-live plan, step 3). nginx 1.24 (Ubuntu 24.04).
#
# It reads, from outside this file:
#   /etc/letsencrypt/live/maxrecallcode.net/   the certificate (certbot)
#   /var/www/letsencrypt/                      certbot's renewal challenges
#
# Only ever proxies to 127.0.0.1:3000, the port that needs signing in.
# Never to 3001, the trusted port, where everyone is the owner.
#
# No shared login in front since 2026-11-06 (limited-live plan, D3
# revised): the app's own sign-in is the only gate, with the limits below.

# Sign-in attempts are limited here, before they reach the app: a login
# checks a password with a 128 MiB scrypt hash (auth.js) on Node's
# 4-thread pool, which file access shares, so a flood of them would stall
# the site. Only login and register: every page asks /api/auth/me
# (account.js), so a limit on all of /api/auth/ would break ordinary
# browsing. This file is included inside nginx.conf's http { } block,
# where these belong.

# Who a visitor is, for the per-visitor limit. An IPv4 address is one
# visitor. An IPv6 visitor usually has a whole /64 (2^64 addresses), so
# the key stands for the address's first four groups, its /64.
#
# Worked out from $remote_addr's text, as nginx writes it
# (ngx_inet6_ntop, src/core/ngx_inet.c): lowercase hex without leading
# zeros, and "::" only for a run of two or more zero groups, the first
# of the longest. So a key never stands for more than one /64, but one
# /64 can have a few keys (e.g. 2001:db8::5 and 2001:db8:0:0:1:: are the
# same /64), so it's approximate in the safe direction: a few times the
# limit for one /64, never unlimited. Regular expressions are tried in
# the order written.
map $remote_addr $maxrecall_visitor {
    # Its first four groups written out: those four.
    "~^(?<prefix>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):" $prefix;
    # "::" after the first group with five groups after it: the run is
    # exactly two zero groups, so the fourth group is the one after "::".
    "~^(?<prefix>[0-9a-f]{1,4}::[0-9a-f]{1,4})(?::[0-9a-f]{1,4}){4}$" $prefix;
    # Otherwise "::" within the first four groups covers the rest of the
    # /64: the groups before it. At least one group, so the key is never
    # empty (limit_req doesn't count a request whose key is empty).
    "~^(?<prefix>[0-9a-f]{1,4}(?::[0-9a-f]{1,4}){0,2})::" $prefix;
    # IPv4, and anything else: the whole address.
    default $remote_addr;
}

# Changing a zone's key needs `systemctl restart nginx`,
# not a reload: a reload refuses it, logs an [emerg] line and keeps the
# old configuration running, and `nginx -t` doesn't notice
# (docs/deploy-vps.md §13, step 8). Found 2026-11-06, when this zone's
# key changed from $binary_remote_addr.
#
# Per visitor: 10 a minute, plus a burst of 5.
limit_req_zone $maxrecall_visitor zone=maxrecall_signin:10m rate=10r/m;
# For the whole site, however many visitors: 30 a minute, plus a burst of
# 10. $server_name is the same for every request to the site, so this is
# one shared count. During a flood, signing in gets 429 until it passes;
# people already signed in aren't affected (sessions last 360 days).
limit_req_zone $server_name zone=maxrecall_signin_all:1m rate=30r/m;

# Plain HTTP, all three names: the certificate challenges certbot uses to
# renew, and otherwise a permanent redirect to the HTTPS site.
server {
    listen 80;
    listen [::]:80;
    server_name maxrecallcode.net maxrecallcode.com maxrecallcode.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://maxrecallcode.net$request_uri;
    }
}

# HTTPS for the other two names: straight to maxrecallcode.net. The one
# certificate covers all three, so this works without a warning.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maxrecallcode.com maxrecallcode.org;

    ssl_certificate     /etc/letsencrypt/live/maxrecallcode.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maxrecallcode.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://maxrecallcode.net$request_uri;
}

# The site.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maxrecallcode.net;

    ssl_certificate     /etc/letsencrypt/live/maxrecallcode.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maxrecallcode.net/privkey.pem;
    # Ubuntu's nginx.conf still allows TLSv1 and TLSv1.1.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Browsers use only HTTPS for this name for a day after a visit (HSTS,
    # RFC 6797). A day while testing; a year (31536000) once it's settled.
    # No includeSubDomains or preload: both are hard to undo.
    add_header Strict-Transport-Security "max-age=86400" always;

    # What the app is told about each request. X-Forwarded-Proto makes
    # Express's req.secure true, and so the session cookie Secure
    # (trust proxy 'loopback', server.js). X-Forwarded-For is the
    # visitor's address, replacing whatever they sent. An Authorization
    # header isn't passed on: the app uses none (it used to carry the
    # shared login's password, D3), and nothing behind nginx should come
    # to trust one a visitor sent.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization "";
    # A Submit can wait behind 10 others in the judge's queue, 2 at a time
    # on the VPS, each up to about 30 s (judge/runner.js, judge/queue.js):
    # about 3 minutes at worst, beyond nginx's 60 s default.
    proxy_read_timeout 300s;

    location = /api/auth/login {
        limit_req zone=maxrecall_signin burst=5 nodelay;
        limit_req zone=maxrecall_signin_all burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/auth/register {
        limit_req zone=maxrecall_signin burst=5 nodelay;
        limit_req zone=maxrecall_signin_all burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
